name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        go-version: [ '1.26' ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Verify dependencies
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: Go Build
        run: go build -v ./...

      - name: Go Test
        if: runner.os != 'Windows'
        run: go test -v -race ./...

      - name: Go Test (Windows)
        if: runner.os == 'Windows'
        run: go test -v ./...
