# TalkIntent Hub Nginx reverse proxy configuration
# Destination: /etc/nginx/conf.d/talkintent.conf

map $http_upgrade $talkintent_conn_upgrade {
    default upgrade;
    ''      close;
}

# HTTP port 80: 301 redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name talkintent.empeirion.cn;

    return 301 https://$host$request_uri;
}

# HTTPS port 443: SNI reverse proxy to local Hub container
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name talkintent.empeirion.cn;

    ssl_certificate     /opt/talkintent/tls/talkintent.crt;
    ssl_certificate_key /opt/talkintent/tls/talkintent.key;

    server_tokens off;
    client_max_body_size 32m;

    # Serve /web directly as 200 without redirect
    location = /web {
        proxy_pass http://127.0.0.1:18800/web/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:18800;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket & long-polling support (timeouts set to 3600s)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $talkintent_conn_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
